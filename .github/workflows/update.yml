name: Update league data

on:
  schedule:
    # Every 5 minutes (GitHub's minimum), offset from :00 because runs at the
    # top of the hour are the ones most likely to be delayed or dropped.
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}   # "Run workflow" button = manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  actions: write    # lets a run start the next one while matches are live
  pages: write
  id-token: write

concurrency:
  group: update-league-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # State carries from run to run through the Actions cache (the win-chance history,
      # last-seen transactions and lineups). The state/ files in the repo are only the
      # starting point if the cache is ever empty.
      - name: Restore state from the last run
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Poll FPL once
        id: poll
        run: python monitor.py --once

      - name: Save state for the next run
        uses: actions/cache/save@v4
        with:
          path: state/
          key: state-${{ github.run_id }}

      - name: Build site
        run: |
          mkdir -p _site/state
          cp index.html _site/index.html
          cp state/dashboard_state_*.json _site/state/
          python -c "import json;c=json.load(open('config.json'));json.dump([{'league_id':l['league_id'],'label':l['label']} for l in c['leagues']],open('_site/leagues.json','w'))"
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub's 5-minute schedule often runs 10-20 minutes apart (sometimes far more), so
      # while matches are live, about to kick off or settling, each run starts the next
      # one itself: an update about every 2 minutes. It stops on its own once matches are
      # over; the schedule above stays as the backstop.
      - name: Keep updating every couple of minutes while matches are on
        if: steps.poll.outputs.fast_poll == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 45
          gh workflow run "${{ github.workflow }}" --ref main
